<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=0">
    <title>ARAFAT | ADMIN LOGIN</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            min-height:100vh; background:radial-gradient(circle at 20% 30%, #0a1a0a, #000000);
            display:flex; justify-content:center; align-items:center;
            font-family:'Share Tech Mono',monospace; overflow:hidden;
        }
        #matrix-canvas { position:fixed; top:0; left:0; width:100%; height:100%; opacity:0.2; z-index:0; pointer-events:none; }
        .login-container {
            position:relative; z-index:2; width:90%; max-width:480px;
            background:rgba(0,0,0,0.65); backdrop-filter:blur(12px);
            border:1px solid rgba(0,255,0,0.3); border-radius:24px;
            padding:2rem 1.8rem; box-shadow:0 0 30px rgba(0,255,0,0.1);
        }
        .top-badge { display:flex; justify-content:space-between; font-size:0.7rem; color:#0f0; border-bottom:1px dashed rgba(0,255,0,0.4); padding-bottom:12px; margin-bottom:20px; }
        .badge { background:rgba(0,255,0,0.1); padding:4px 10px; border-radius:20px; }
        .drift-logo { font-size:2.5rem; font-family:'Space Grotesk',sans-serif; background:linear-gradient(135deg,#0f0,#ff6666); -webkit-background-clip:text; background-clip:text; color:transparent; text-align:center; }
        .sub { text-align:center; font-size:0.8rem; color:#ff6666; margin-top:5px; }
        .tag-row { display:flex; justify-content:center; gap:20px; margin:10px 0; font-size:0.7rem; color:#6cff6c; }
        .terminal-prompt { background:#0a1a0a; padding:8px 15px; margin:20px 0; border-left:3px solid #0f0; display:flex; align-items:center; gap:10px; color:#0f0; }
        .input-group { margin-bottom:18px; }
        .input-group label { display:block; font-size:0.7rem; color:#0f0; margin-bottom:5px; }
        .input-group input { width:100%; background:rgba(0,20,0,0.7); border:1px solid #0f0; border-radius:10px; padding:12px 15px; color:#0f0; font-family:monospace; outline:none; }
        .btn-auth { width:100%; background:linear-gradient(90deg,#0a1a0a,#001a00); border:1px solid #0f0; padding:12px; border-radius:40px; color:#0f0; font-weight:bold; cursor:pointer; transition:0.3s; font-family:monospace; }
        .btn-auth:hover { background:#0f0; color:#000; box-shadow:0 0 20px #0f0; }
        .footer-warning { margin-top:25px; text-align:center; font-size:0.6rem; color:#ff6666; border-top:1px solid rgba(255,102,102,0.3); padding-top:15px; }
    </style>
</head>
<body>
<canvas id="matrix-canvas"></canvas>
<div class="login-container">
    <div class="top-badge"><span class="badge">⚡ ADMIN MODE</span><span class="badge">v2.3</span></div>
    <div class="drift-logo">ARAFAT</div><div class="sub">AUTHORITY ACCESS</div>
    <div class="tag-row"><span>🔷 SECURE</span><span>🛡️ ROOT</span><span>💻 TERMINAL</span></div>
    <div class="terminal-prompt"><span>$></span><span style="flex:1">_ADMIN_AUTH_REQUIRED_</span></div>
    <form method="POST" action="/admin-login">
        <div class="input-group"><label><i class="fas fa-user-shield"></i> ADMIN USERNAME</label><input type="text" name="username" placeholder="ARAFATFLEX" autocomplete="off" required></div>
        <div class="input-group"><label><i class="fas fa-key"></i> MASTER PASSWORD</label><input type="password" name="password" placeholder="••••••••" required></div>
        <button type="submit" class="btn-auth">AUTHENTICATE</button>
    </form>
    <div class="footer-warning">⚠ UNAUTHORIZED ACCESS PROHIBITED</div>
</div>
<script>
    const canvas = document.getElementById('matrix-canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth; canvas.height = window.innerHeight;
    const letters = "01ARAFATADMIN";
    const fontSize = 14;
    const columns = canvas.width / fontSize;
    const drops = Array(Math.floor(columns)).fill(1);
    function draw() {
        ctx.fillStyle = 'rgba(0,0,0,0.05)';
        ctx.fillRect(0,0,canvas.width,canvas.height);
        ctx.fillStyle = '#0f0';
        ctx.font = fontSize + 'px monospace';
        for(let i=0;i<drops.length;i++) {
            const text = letters.charAt(Math.floor(Math.random()*letters.length));
            ctx.fillText(text, i*fontSize, drops[i]*fontSize);
            if(drops[i]*fontSize > canvas.height && Math.random()>0.975) drops[i]=0;
            drops[i]++;
        }
    }
    setInterval(draw,60);
    window.addEventListener('resize',()=>{ canvas.width=window.innerWidth; canvas.height=window.innerHeight; });
</script>
</body>
                           </html>
