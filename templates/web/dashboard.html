<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=yes, viewport-fit=cover">
    <title>NEBULA CORE | MULTI-SERVER STUDIO</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/theme/dracula.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/mode/python/python.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, 'Segoe UI', monospace;
            background: #03045E;
            color: #E2E8F0;
            min-height: 100vh;
        }

        .bg-ocean {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 30%, #0077B6, #03045E);
            z-index: -2;
        }
        .bg-grid {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: linear-gradient(#00B4D8 1px, transparent 1px), linear-gradient(90deg, #00B4D8 1px, transparent 1px);
            background-size: 40px 40px;
            opacity: 0.08;
            z-index: -1;
            pointer-events: none;
        }

        .topbar {
            position: relative;
            z-index: 20;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 24px;
            background: rgba(0, 119, 182, 0.5);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid #90E0EF;
        }
        .logo-box {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 800;
            font-size: 1.3rem;
            color: #CAF0F8;
            letter-spacing: -0.3px;
        }
        .btn-icon {
            background: rgba(144, 224, 239, 0.2);
            border: 1px solid #00B4D8;
            border-radius: 12px;
            padding: 8px 14px;
            color: #CAF0F8;
            cursor: pointer;
            font-weight: 600;
            transition: 0.2s;
        }
        .btn-icon:hover {
            background: #00B4D8;
            color: #03045E;
        }

        .container {
            position: relative;
            z-index: 10;
            padding: 20px 18px;
            max-width: 1300px;
            margin: auto;
        }

        .srv-card, .fm-card, .console-panel, .settings-card {
            background: rgba(0, 51, 102, 0.65);
            backdrop-filter: blur(8px);
            border: 1px solid #00B4D8;
            border-radius: 16px;
            transition: 0.2s;
        }
        .srv-card {
            padding: 16px 20px;
            margin-bottom: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .srv-card:hover {
            background: rgba(0, 119, 182, 0.7);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(0,180,216,0.3);
        }

        .resource-bar {
            width: 100%;
            height: 6px;
            background: #03045E;
            border-radius: 6px;
            overflow: hidden;
            margin-top: 8px;
        }
        .cpu-fill { background: #00B4D8; height: 100%; width: 0%; transition: width 0.5s ease; }
        .ram-fill { background: #90E0EF; height: 100%; width: 0%; transition: width 0.5s ease; }

        .console-panel {
            margin-bottom: 24px;
            overflow: hidden;
        }
        .terminal-header {
            padding: 12px 16px;
            background: rgba(0, 0, 0, 0.3);
            border-bottom: 1px solid #0077B6;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        #console {
            height: 260px;
            overflow-y: auto;
            padding: 14px;
            font-family: 'Fira Code', monospace;
            background: #010529;
            color: #CAF0F8;
            font-size: 12px;
            line-height: 1.4;
        }
        .terminal-input-area {
            padding: 12px;
            background: #03045Eaa;
            display: flex;
            gap: 10px;
            border-top: 1px solid #0077B6;
        }
        .term-input {
            flex: 1;
            background: #010529;
            border: 1px solid #00B4D8;
            border-radius: 40px;
            padding: 8px 16px;
            color: white;
            font-family: monospace;
            outline: none;
        }

        .fm-table-wrapper {
            overflow-x: auto;
        }
        .fm-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.8rem;
        }
        .fm-table th, .fm-table td {
            padding: 12px 10px;
            text-align: left;
            border-bottom: 1px solid #0077B6;
        }
        .file-name {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            font-weight: 500;
        }
        .file-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            flex-wrap: wrap;
        }
        .file-actions i {
            font-size: 1rem;
            cursor: pointer;
            color: #90E0EF;
            transition: 0.1s;
            padding: 4px;
        }
        .file-actions i:hover { color: white; transform: scale(1.05); }
        
        .fm-toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            padding: 14px 18px;
            border-bottom: 1px solid #0077B6;
        }
        .fm-btn {
            background: #03045E;
            border: 1px solid #00B4D8;
            border-radius: 30px;
            padding: 6px 14px;
            font-size: 0.7rem;
            color: #CAF0F8;
            cursor: pointer;
            transition: all 0.2s;
        }
        .fm-btn:hover {
            background: #0077B6;
            transform: translateY(-1px);
        }
        .btn-primary {
            background: #0077B6;
            border: none;
            border-radius: 30px;
            padding: 8px 18px;
            font-weight: 600;
            color: white;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-primary:hover {
            background: #00B4D8;
            transform: translateY(-1px);
        }
        .btn-secondary {
            background: rgba(144, 224, 239, 0.2);
            border: 1px solid #00B4D8;
            border-radius: 30px;
            padding: 6px 14px;
            color: #CAF0F8;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-secondary:hover {
            background: rgba(144, 224, 239, 0.4);
            transform: translateY(-1px);
        }

        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: #03045Ecc;
            backdrop-filter: blur(6px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-box {
            background: #0a2f5a;
            border-radius: 20px;
            border: 1px solid #90E0EF;
            width: 90%;
            max-width: 460px;
            padding: 24px;
        }
        .modal-box input, .modal-box select {
            background: #010529;
            border: 1px solid #00B4D8;
            padding: 10px;
            border-radius: 20px;
            color: white;
            width: 100%;
            margin-top: 6px;
        }
        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 22px;
        }
        .toggle-switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #03045E;
            border-radius: 34px;
            border: 1px solid #00B4D8;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 16px;
            width: 16px;
            left: 3px;
            bottom: 2px;
            background-color: #CAF0F8;
            border-radius: 50%;
            transition: 0.2s;
        }
        input:checked + .slider:before { transform: translateX(20px); }
        input:checked + .slider { background-color: #00B4D8; }
        
        @media (max-width: 680px) {
            .srv-card { flex-direction: column; align-items: flex-start; gap: 12px; }
            .fm-table th, .fm-table td { padding: 8px 6px; }
            .file-actions { gap: 5px; }
        }
        .font-control {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .font-control button {
            background: #0077B6;
            border: none;
            border-radius: 30px;
            width: 28px;
            height: 28px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }
        .font-control button:hover {
            background: #00B4D8;
            transform: scale(1.05);
        }
        
        .server-count-badge {
            background: #0077B6;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            margin-left: 10px;
        }
    </style>
</head>
<body>
<div class="bg-ocean"></div>
<div class="bg-grid"></div>
<div class="topbar">
    <div class="logo-box"><i class="fas fa-cubes"></i><span>NEBULA·CORE</span></div>
    <button class="btn-icon" onclick="location.href='/logout'"><i class="fas fa-sign-out-alt"></i> EXIT</button>
</div>

<div class="container" id="homeView">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 22px; flex-wrap:wrap; gap:12px;">
        <h2 style="font-size:1.3rem;"><i class="fas fa-server"></i> WORKSPACES <span id="serverCount" class="server-count-badge">0</span></h2>
        <button class="btn-primary" onclick="openPreCreateSettings()"><i class="fas fa-plus-circle"></i> NEW SERVER</button>
    </div>
    <div id="srvList"></div>
</div>

<div class="container" id="manageView" style="display:none;">
    <div style="display: flex; justify-content: space-between; flex-wrap: wrap; gap: 12px; margin-bottom: 18px;">
        <button class="btn-secondary" onclick="goBackToServers()"><i class="fas fa-arrow-left"></i> BACK TO ALL SERVERS</button>
        <div id="vUptime" style="background:#03045E; padding:6px 14px; border-radius:30px;"><i class="fas fa-circle"></i> OFFLINE</div>
        <button class="btn-secondary" onclick="openServerSettings()"><i class="fas fa-sliders-h"></i> SETTINGS</button>
    </div>
    
    <div style="display: flex; flex-wrap: wrap; gap: 20px; background:#0a2f5acc; border-radius: 16px; padding: 14px 18px; margin-bottom: 20px; border:1px solid #00B4D8;">
        <div style="flex:1"><span><i class="fas fa-microchip"></i> CPU</span><div class="resource-bar"><div id="cpuFill" class="cpu-fill"></div></div><span id="cpuPercent" style="font-size:0.7rem;">0%</span></div>
        <div style="flex:1"><span><i class="fas fa-memory"></i> RAM</span><div class="resource-bar"><div id="ramFill" class="ram-fill"></div></div><span id="ramPercent" style="font-size:0.7rem;">0%</span></div>
        <div style="flex:1"><span><i class="fas fa-chart-line"></i> PROCESS</span><div><span id="activeProc">—</span></div></div>
    </div>
    
    <div style="display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; margin-bottom: 20px;">
        <div style="display: flex; gap: 10px; flex-wrap: wrap;">
            <button class="btn-primary" onclick="srvAction('start')"><i class="fas fa-play"></i> START</button>
            <button class="btn-secondary" onclick="srvAction('restart')"><i class="fas fa-sync"></i> RESTART</button>
            <button class="btn-secondary" onclick="srvAction('stop')"><i class="fas fa-stop"></i> STOP</button>
            <button class="btn-secondary" onclick="clearConsoleNow()"><i class="fas fa-eraser"></i> CLEAR</button>
        </div>
        <div class="font-control">
            <button onclick="changeFontSize(-1)"><i class="fas fa-minus"></i></button>
            <span id="fontSizeLabel" style="font-size:0.7rem;">12px</span>
            <button onclick="changeFontSize(1)"><i class="fas fa-plus"></i></button>
        </div>
    </div>
    
    <div class="console-panel">
        <div class="terminal-header"><span><i class="fas fa-terminal"></i> LIVE CONSOLE · <span id="vSrvName">—</span></span></div>
        <div id="console"></div>
        <div class="terminal-input-area"><span style="color:#90E0EF;">$></span><input type="text" id="termCmd" class="term-input" placeholder="Enter command..." onkeydown="if(event.key==='Enter') sendConsoleCommand()"></div>
    </div>
    
    <div class="fm-card">
        <div class="fm-toolbar">
            <button class="fm-btn" id="fmUploadBtn"><i class="fas fa-cloud-upload-alt"></i> UPLOAD</button>
            <button class="fm-btn" id="fmInstallBtn"><i class="fab fa-python"></i> INSTALL REQ</button>
            <button class="fm-btn" id="fmNewFileBtn"><i class="fas fa-file"></i> NEW FILE</button>
            <button class="fm-btn" id="fmNewFolderBtn"><i class="fas fa-folder-plus"></i> FOLDER</button>
            <button class="fm-btn" id="fmRefreshBtn"><i class="fas fa-sync-alt"></i> REFRESH</button>
        </div>
        <div class="fm-breadcrumb" id="fmBreadcrumb" style="padding: 8px 16px; font-size:0.7rem; border-bottom:1px solid #0077B6;"></div>
        <div class="fm-table-wrapper">
            <table class="fm-table">
                <thead><tr><th>NAME</th><th>SIZE</th><th style="text-align:right">ACTIONS</th></tr></thead>
                <tbody id="fmFileList"></tbody>
            </table>
            <div id="fmEmptyMsg" style="display:none; text-align:center; padding:30px;">📁 empty folder</div>
        </div>
    </div>
</div>

<div id="globalSettingsModal" class="modal-overlay">
    <div class="modal-box">
        <h3 style="margin-bottom: 16px;"><i class="fas fa-cog"></i> SERVER CONFIGURATOR</h3>
        <div style="margin-bottom: 16px;">
            <label>🔧 Server Name</label>
            <input type="text" id="modalServerName" placeholder="e.g., my-bot">
        </div>
        <div style="margin-bottom: 16px;">
            <label>⚙️ Main Entry File</label>
            <input type="text" id="modalMainFile" placeholder="main.py / bot.py">
        </div>
        <div style="margin-bottom: 16px;">
            <label>📦 Requirements (comma/space)</label>
            <input type="text" id="modalRequirements" placeholder="flask requests">
        </div>
        <div style="margin-bottom: 16px; display: flex; justify-content: space-between;">
            <span>🗜️ Auto-unzip after upload</span>
            <label class="toggle-switch"><input type="checkbox" id="modalAutoUnzip"><span class="slider"></span></label>
        </div>
        <div style="display: flex; gap: 12px; margin-top: 10px;">
            <button class="btn-primary" id="modalConfirmBtn">CREATE / UPDATE</button>
            <button class="btn-secondary" onclick="closeGlobalModal()">CANCEL</button>
        </div>
        <div id="modalRenameWrapper" style="margin-top: 16px; border-top: 1px solid #0077B6; padding-top: 12px; display: none;">
            <button class="btn-secondary" id="renameServerBtn"><i class="fas fa-pen"></i> RENAME THIS SERVER</button>
        </div>
    </div>
</div>

<script>
    // LocalStorage-based server management (Demo mode - works without backend)
    let curSrv = null;
    let logInterval = null;
    let currentPath = "";
    let editorInstance = null;
    let currentFontSize = 12;
    let autoUnzipFlag = false;
    let modalMode = "create";
    
    // Initialize demo servers if none exist
    function initDemoServers() {
        let servers = localStorage.getItem('nebula_servers');
        if (!servers) {
            let demoServer = {
                id: 'server_' + Date.now(),
                name: 'Demo Server',
                folder: 'demo_server',
                online: false,
                cpu: '0%',
                ram: '0MB',
                cpu_percent: 0,
                created: new Date().toISOString(),
                files: {
                    'main.py': 'print("Hello from Demo Server!")',
                    'README.md': '# Demo Server\n\nThis is a demo server created automatically.'
                },
                folders: {}
            };
            localStorage.setItem('nebula_servers', JSON.stringify([demoServer]));
        }
    }
    
    function escapeHtml(s) { 
        return s ? s.replace(/[&<>]/g, function(m){ 
            return m==='&'?'&amp;':m==='<'?'&lt;':'&gt;'; 
        }) : ''; 
    }
    
    function formatSize(b) { 
        if(!b) return '—'; 
        if(b<1024) return b+' B'; 
        if(b<1048576) return (b/1024).toFixed(1)+' KB'; 
        return (b/1048576).toFixed(1)+' MB'; 
    }
    
    // Get all servers
    function getServers() {
        const servers = localStorage.getItem('nebula_servers');
        return servers ? JSON.parse(servers) : [];
    }
    
    // Save servers
    function saveServers(servers) {
        localStorage.setItem('nebula_servers', JSON.stringify(servers));
    }
    
    // Load and display all servers
    async function loadServers() {
        const servers = getServers();
        const cont = document.getElementById('srvList');
        const serverCountSpan = document.getElementById('serverCount');
        
        serverCountSpan.textContent = servers.length;
        
        if(servers.length === 0){
            cont.innerHTML = `<div style="background:#0a2f5a; border-radius:16px; padding:40px; text-align:center;">
                <i class="fas fa-cloud" style="font-size: 3rem; margin-bottom: 15px;"></i>
                <p>✨ No servers yet. Click NEW SERVER to create one!</p>
            </div>`;
            return;
        }
        
        cont.innerHTML = servers.map(s => `
            <div class="srv-card" onclick='openSrv(${JSON.stringify(s)})'>
                <div style="flex: 1;">
                    <div style="font-weight:800; font-size:1.1rem; display: flex; align-items: center; gap: 10px;">
                        <i class="fas fa-server"></i>
                        ${escapeHtml(s.name)}
                        <span style="font-size:0.7rem; background: #0077B6; padding: 2px 8px; border-radius: 12px;">${s.online ? '🟢' : '⚫'}</span>
                    </div>
                    <div style="font-size:0.7rem; color:#90E0EF; margin-top: 5px;">📁 ${escapeHtml(s.folder)}</div>
                    <div class="resource-bar" style="margin-top: 10px;">
                        <div class="cpu-fill" style="width:${s.cpu_percent || 0}%"></div>
                    </div>
                    <div style="display:flex; gap:15px; margin-top:8px; font-size:0.7rem;">
                        <span><i class="fas fa-microchip"></i> CPU ${s.cpu || '0%'}</span>
                        <span><i class="fas fa-memory"></i> RAM ${s.ram || '0MB'}</span>
                    </div>
                </div>
                <div style="display: flex; gap: 15px;">
                    <i class="fas fa-trash-alt" style="color:#FF6B6B; cursor:pointer; font-size: 1.2rem;" onclick="event.stopPropagation(); deleteServer('${s.id}', '${escapeHtml(s.name)}')"></i>
                </div>
            </div>
        `).join('');
    }
    
    async function deleteServer(id, name){
        let result = await Swal.fire({
            title: 'Destroy Server?',
            text: `Server "${name}" and all its data will be lost forever!`,
            icon: 'warning',
            showCancelButton: true,
            confirmButtonColor: '#d33',
            cancelButtonColor: '#3085d6',
            confirmButtonText: 'Yes, delete it!',
            background: '#03045E',
            color: '#CAF0F8'
        });
        
        if(result.isConfirmed){
            let servers = getServers();
            servers = servers.filter(s => s.id !== id);
            saveServers(servers);
            
            if(curSrv && curSrv.id === id){
                goBackToServers();
            } else {
                await loadServers();
            }
            Swal.fire('Deleted!', 'Server has been deleted.', 'success');
        }
    }
    
    function goBackToServers(){
        document.getElementById('homeView').style.display = 'block';
        document.getElementById('manageView').style.display = 'none';
        if(logInterval){
            clearInterval(logInterval);
            logInterval = null;
        }
        curSrv = null;
        loadServers();
    }
    
    function openSrv(s){
        curSrv = s;
        document.getElementById('homeView').style.display = 'none';
        document.getElementById('manageView').style.display = 'block';
        document.getElementById('vSrvName').innerText = s.name;
        currentPath = "";
        loadFileManager();
        startResourceAndLogs();
        loadSettingsIntoMemory();
    }
    
    async function startResourceAndLogs(){
        if(logInterval){
            clearInterval(logInterval);
        }
        
        await updateServerStats();
        
        logInterval = setInterval(async() => {
            if(!curSrv) return;
            await updateServerStats();
        }, 1700);
    }
    
    async function updateServerStats(){
        if(!curSrv) return;
        
        // Simulate random CPU/RAM usage for demo
        const cpuUsage = Math.floor(Math.random() * 60) + 5;
        const ramUsage = Math.floor(Math.random() * 40) + 10;
        
        // Update server stats in localStorage
        let servers = getServers();
        const serverIndex = servers.findIndex(s => s.id === curSrv.id);
        if(serverIndex !== -1) {
            servers[serverIndex].cpu = cpuUsage + '%';
            servers[serverIndex].ram = ramUsage + 'MB';
            servers[serverIndex].cpu_percent = cpuUsage;
            servers[serverIndex].online = curSrv.online !== false;
            saveServers(servers);
            curSrv = servers[serverIndex];
        }
        
        document.getElementById('cpuPercent').innerText = cpuUsage + '%';
        document.getElementById('ramPercent').innerText = ramUsage + '%';
        document.getElementById('cpuFill').style.width = cpuUsage + '%';
        document.getElementById('ramFill').style.width = ramUsage + '%';
        document.getElementById('activeProc').innerText = Math.floor(Math.random() * 5) + 1;
        
        // Simulate console logs
        const consoleDiv = document.getElementById('console');
        const currentLog = consoleDiv.getAttribute('data-raw') || '';
        if(Math.random() < 0.3) { // Add random log occasionally
            const newLog = currentLog + `\n[${new Date().toLocaleTimeString()}] Server ${curSrv.name} - CPU: ${cpuUsage}%, RAM: ${ramUsage}MB`;
            consoleDiv.setAttribute('data-raw', newLog);
            const lines = newLog.split('\n').slice(-280);
            consoleDiv.innerHTML = lines.map(l => `<div style="white-space:pre-wrap;">${escapeHtml(l)}</div>`).join('');
            consoleDiv.scrollTop = consoleDiv.scrollHeight;
        }
        
        document.getElementById('vUptime').innerHTML = curSrv.online !== false ? 
            '<i class="fas fa-circle" style="color:#22c55e;"></i> ONLINE' : 
            '<i class="fas fa-circle" style="color:#ef4444;"></i> OFFLINE';
    }
    
    function sendConsoleCommand(){
        let cmd = document.getElementById('termCmd').value;
        if(cmd && curSrv){
            const consoleDiv = document.getElementById('console');
            const currentLog = consoleDiv.getAttribute('data-raw') || '';
            const newLog = currentLog + `\n$> ${cmd}\nCommand executed: ${cmd}`;
            consoleDiv.setAttribute('data-raw', newLog);
            const lines = newLog.split('\n').slice(-280);
            consoleDiv.innerHTML = lines.map(l => `<div style="white-space:pre-wrap;">${escapeHtml(l)}</div>`).join('');
            consoleDiv.scrollTop = consoleDiv.scrollHeight;
            document.getElementById('termCmd').value = '';

    // File manager functions
    function getServerFiles() {
        const filesKey = `nebula_files_${curSrv.id}`;
        const files = localStorage.getItem(filesKey);
        return files ? JSON.parse(files) : { files: {}, folders: {} };
    }
    
    function saveServerFiles(data) {
        const filesKey = `nebula_files_${curSrv.id}`;
        localStorage.setItem(filesKey, JSON.stringify(data));
    }
    
    function getCurrentDirectoryFiles() {
        const data = getServerFiles();
        const pathParts = currentPath.split('/').filter(p => p);
        let currentFiles = data.files;
        let currentFolders = data.folders;
        
        // Navigate through folders
        for(const folder of pathParts) {
            if(currentFolders[folder]) {
                currentFiles = currentFolders[folder].files || {};
                currentFolders = currentFolders[folder].folders || {};
            } else {
                return [];
            }
        }
        
        // Combine files and folders for display
        const items = [];
        
        // Add folders
        for(const [name, content] of Object.entries(currentFolders)) {
            items.push({
                name: name,
                is_dir: true,
                size: 0
            });
        }
        
        // Add files
        for(const [name, content] of Object.entries(currentFiles)) {
            items.push({
                name: name,
                is_dir: false,
                size: content.length || 0
            });
        }
        
        return items;
    }
    
    async function loadFileManager(){
        if(!curSrv) return;
        
        const items = getCurrentDirectoryFiles();
        const tbody = document.getElementById('fmFileList');
        const emptyDiv = document.getElementById('fmEmptyMsg');
        
        if(!items.length){
            tbody.innerHTML = '';
            emptyDiv.style.display = 'block';
            renderBreadcrumb();
            return;
        }
        
        emptyDiv.style.display = 'none';
        tbody.innerHTML = items.map(f => {
            let isZip = f.name.toLowerCase().endsWith('.zip');
            return `<tr>
                <td><div class="file-name" onclick="${f.is_dir ? `enterFolder('${escapeHtml(f.name)}')` : `editFile('${escapeHtml(f.name)}')`}">
                    <i class="fas ${f.is_dir ? 'fa-folder' : (isZip ? 'fa-file-archive' : 'fa-file-code')}"></i> 
                    ${escapeHtml(f.name)}
                </div></td>
                <td>${f.is_dir ? '—' : formatSize(f.size)}</td>
                <td class="file-actions">
                    ${!f.is_dir ? `<i class="fas fa-edit" onclick="event.stopPropagation(); editFile('${escapeHtml(f.name)}')" title="Edit"></i>` : ''}
                    <i class="fas fa-i-cursor" onclick="event.stopPropagation(); renameItem('${escapeHtml(f.name)}', ${f.is_dir})" title="Rename"></i>
                    ${!f.is_dir ? `<i class="fas fa-download" onclick="event.stopPropagation(); downloadFile('${escapeHtml(f.name)}')" title="Download"></i>` : ''}
                    <i class="fas fa-trash" style="color:#ffaa66;" onclick="event.stopPropagation(); deleteItem('${escapeHtml(f.name)}', ${f.is_dir})" title="Delete"></i>
                </td>
             </tr>`;
        }).join('');
        renderBreadcrumb();
    }
    
    function renderBreadcrumb(){
        let parts = currentPath.split('/').filter(p => p);
        let html = `<span onclick="navigateToRoot()" style="cursor:pointer; color:#90E0EF;">📁 ROOT</span>`;
        let cum = "";
        for(let p of parts){
            cum += (cum ? '/' : '') + p;
            html += ` <span style="color:#00B4D8;">/</span> <span onclick="navigateToPath('${cum}')" style="cursor:pointer; color:#90E0EF;">${escapeHtml(p)}</span>`;
        }
        document.getElementById('fmBreadcrumb').innerHTML = html;

    async function editFile(name){
        const data = getServerFiles();
        const pathParts = currentPath.split('/').filter(p => p);
        let currentFiles = data.files;
        let currentFolders = data.folders;
        
        // Navigate to correct folder
        for(const folder of pathParts) {
            if(currentFolders[folder]) {
                currentFiles = currentFolders[folder].files;
                currentFolders = currentFolders[folder].folders;
            }
        }
        
        const content = currentFiles[name] || '';
        document.getElementById('edFile').innerText = name;
        document.getElementById('edText').value = content;
        document.getElementById('editor').style.display = 'flex';
        
        if(!editorInstance){
            editorInstance = CodeMirror.fromTextArea(document.getElementById('edText'), {
                mode: name.endsWith('.py') ? "python" : "text",
                theme: "dracula",
                lineNumbers: true
            });
        } else {
            editorInstance.setValue(content);
        }
    }
    
    async function saveFileContent(){
        let name = document.getElementById('edFile').innerText;
        let content = editorInstance.getValue();
        
        const data = getServerFiles();
        const pathParts = currentPath.split('/').filter(p => p);
        let currentFiles = data.files;
        let currentFolders = data.folders;
        let parent = data;
        
        // Navigate to correct folder
        for(let i = 0; i < pathParts.length; i++) {
            const folder = pathParts[i];
            if(!currentFolders[folder]) {
                currentFolders[folder] = { files: {}, folders: {} };
            }
            if(i === pathParts.length - 1) {
                currentFolders[folder].files[name] = content;
            } else {
                currentFolders = currentFolders[folder].folders;
                currentFiles = currentFolders[folder]?.files || {};
            }
        }
        
        if(pathParts.length === 0) {
            data.files[name] = content;
        }
        
        saveServerFiles(data);
        closeEditor();
        Swal.fire({toast:true, icon:'success', title:'File saved!'});
        loadFileManager();
    }

    async function deleteItem(name, isDir){
        let result = await Swal.fire({
            title: 'Delete Item?',
            text: `Are you sure you want to delete "${name}"?`,
            showCancelButton: true,
            background: '#03045E'
        });
        
        if(result.isConfirmed){
            const data = getServerFiles();
            const pathParts = currentPath.split('/').filter(p => p);
            let currentFiles = data.files;
            let currentFolders = data.folders;
            
            // Navigate to correct folder
            for(let i = 0; i < pathParts.length; i++) {
                const folder = pathParts[i];
                if(currentFolders[folder]) {
                    if(i === pathParts.length - 1) {
                        if(isDir) {
                            delete currentFolders[folder].folders[name];
                        } else {
                            delete currentFolders[folder].files[name];
                        }
                    } else {
                        currentFolders = currentFolders[folder].folders;
                        currentFiles = currentFolders[folder]?.files || {};
                    }
                }
            }
            
            if(pathParts.length === 0) {
                if(isDir) {
                    delete data.folders[name];
                } else {
                    delete data.files[name];
                }
            }
            
            saveServerFiles(data);
            loadFileManager();
            Swal.fire({toast:true, icon:'success', title:'Deleted!'});
        }
    }
    
    async function renameItem(oldName, isDir){
        let {value:newName} = await Swal.fire({
            title:'Rename',
            input:'text',
            inputValue:oldName,
            background:'#03045E'
        });
        
        if(newName && newName !== oldName){
            const data = getServerFiles();
            const pathParts = currentPath.split('/').filter(p => p);
            let currentFiles = data.files;
            let currentFolders = data.folders;
            
            // Navigate to correct folder
            for(let i = 0; i < pathParts.length; i++) {
                const folder = pathParts[i];
                if(currentFolders[folder]) {
                    if(i === pathParts.length - 1) {
                        if(isDir && currentFolders[folder].folders[oldName]) {
                            currentFolders[folder].folders[newName] = currentFolders[folder].folders[oldName];
                            delete currentFolders[folder].folders[oldName];
                        } else if(currentFolders[folder].files[oldName]) {
                            currentFolders[folder].files[newName] = currentFolders[folder].files[oldName];
                            delete currentFolders[folder].files[oldName];
                        }
                    } else {
                        currentFolders = currentFolders[folder].folders;
                        currentFiles = currentFolders[folder]?.files || {};
                    }
                }
            }
            
            if(pathParts.length === 0) {
                if(isDir && data.folders[oldName]) {
                    data.folders[newName] = data.folders[oldName];
                    delete data.folders[oldName];
                } else if(data.files[oldName]) {
                    data.files[newName] = data.files[oldName];
                    delete data.files[oldName];
                }
            }
            
            saveServerFiles(data);
            loadFileManager();
        }
    }
    
    function downloadFile(name){
        const data = getServerFiles();
        const pathParts = currentPath.split('/').filter(p => p);
        let currentFiles = data.files;
        let currentFolders = data.folders;
        
        // Navigate to correct folder
        for(const folder of pathParts) {
            if(currentFolders[folder]) {
                currentFiles = currentFolders[folder].files;
                currentFolders = currentFolders[folder].folders;
            }
        }
        
        const content = currentFiles[name] || '';
        const blob = new Blob([content], {type: 'text/plain'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = name;
        a.click();
        URL.revokeObjectURL(url);
    }

    document.getElementById('modalConfirmBtn').onclick = async () => {
        let srvName = document.getElementById('modalServerName').value.trim();
        let mainFile = document.getElementById('modalMainFile').value.trim();
        let reqs = document.getElementById('modalRequirements').value;
        let autoZip = document.getElementById('modalAutoUnzip').checked;
        
        if(modalMode === 'create'){
            if(!srvName){
                Swal.fire('Error', 'Server name is required!', 'error');
                return;
            }
            
            // Check if server name already exists
            let servers = getServers();
            if(servers.some(s => s.name === srvName)) {
                Swal.fire('Error', 'A server with this name already exists!', 'error');
                return;
            }
            
            const newServer = {
                id: 'server_' + Date.now(),
                name: srvName,
                folder: srvName.toLowerCase().replace(/[^a-z0-9]/g, '_'),
                online: false,
                cpu: '0%',
                ram: '0MB',
                cpu_percent: 0,
                created: new Date().toISOString()
            };
            
            servers.push(newServer);
            saveServers(servers);
            
            // Save settings
            let key = `srv_settings_${newServer.id}`;
            localStorage.setItem(key, JSON.stringify({
                mainFile: mainFile,
                requirements: reqs,
                autoUnzip: autoZip
            }));
            
            // Initialize empty files for new server
            const filesKey = `nebula_files_${newServer.id}`;
            localStorage.setItem(filesKey, JSON.stringify({ files: {}, folders: {} }));
            
            await loadServers();
            Swal.fire({toast:true, icon:'success', title:'Server created successfully!'});
            closeGlobalModal();
        } 
        else if(modalMode === 'edit' && curSrv){
            let key = `srv_settings_${curSrv.id}`;
            let existing = localStorage.getItem(key);
            let sets = existing ? JSON.parse(existing) : {};
            sets.mainFile = mainFile;
            sets.requirements = reqs;
            sets.autoUnzip = autoZip;
            localStorage.setItem(key, JSON.stringify(sets));
            autoUnzipFlag = autoZip;
            
            Swal.fire({toast:true, title:'Settings saved!', icon:'success'});
            closeGlobalModal();
        }
    };

    async function srvAction(act){
        if(!curSrv) return;
        
        let servers = getServers();
        const serverIndex = servers.findIndex(s => s.id === curSrv.id);
        
        if(act === 'start') {
            if(serverIndex !== -1) {
                servers[serverIndex].online = true;
                saveServers(servers);
                curSrv.online = true;
            }
            const consoleDiv = document.getElementById('console');
            const currentLog = consoleDiv.getAttribute('data-raw') || '';
            const newLog = currentLog + `\n[${new Date().toLocaleTimeString()}] Server starting...\nServer started successfully!`;
            consoleDiv.setAttribute('data-raw', newLog);
            consoleDiv.innerHTML = newLog.split('\n').map(l => `<div>${escapeHtml(l)}</div>`).join('');
        } 
        else if(act === 'stop') {
            if(serverIndex !== -1) {
                servers[serverIndex].online = false;
                saveServers(servers);
                curSrv.online = false;
            }
            const consoleDiv = document.getElementById('console');
            const currentLog = consoleDiv.getAttribute('data-raw') || '';
            const newLog = currentLog + `\n[${new Date().toLocaleTimeString()}] Server stopping...\nServer stopped.`;
            consoleDiv.setAttribute('data-raw', newLog);
            consoleDiv.innerHTML = newLog.split('\n').map(l => `<div>${escapeHtml(l)}</div>`).join('');
        }
        else if(act === 'restart') {
            if(serverIndex !== -1) {
                servers[serverIndex].online = true;
                saveServers(servers);
                curSrv.online = true;
            }
            const consoleDiv = document.getElementById('console');
            const currentLog = consoleDiv.getAttribute('data-raw') || '';
            const newLog = currentLog + `\n[${new Date().toLocaleTimeString()}] Server restarting...\nServer restarted successfully!`;
            consoleDiv.setAttribute('data-raw', newLog);
            consoleDiv.innerHTML = newLog.split('\n').map(l => `<div>${escapeHtml(l)}</div>`).join('');
        }
        
        Swal.fire({toast:true, icon:'info', title:`${act.toUpperCase()} triggered!`, timer:1200});
        setTimeout(() => updateServerStats(), 500);
    }
