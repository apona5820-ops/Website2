<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=0">
    <title>Login | APON HOSTING</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #03045E 0%, #0077B6 50%, #00B4D8 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'Poppins', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            position: relative;
        }

        /* Subtle background pattern */
        body::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(#90E0EF 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
            opacity: 0.3;
        }

        .login-container {
            position: relative;
            z-index: 2;
            width: 90%;
            max-width: 500px;
            background: #CAF0F8;
            border-radius: 28px;
            padding: 2.5rem 2rem;
            box-shadow: 0 20px 50px rgba(3, 4, 94, 0.3), 0 0 0 1px rgba(0, 180, 216, 0.2);
            transition: transform 0.3s ease;
        }

        .login-container:hover {
            transform: translateY(-3px);
        }

        /* Header section */
        .hosting-badge {
            text-align: center;
            margin-bottom: 1.2rem;
        }

        .hosting-badge span {
            font-size: 0.75rem;
            color: #0077B6;
            background: #90E0EF;
            padding: 5px 14px;
            border-radius: 30px;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        /* Title section */
        .brand-title {
            text-align: center;
            margin-bottom: 0.5rem;
        }

        .brand-title h1 {
            font-size: 2.2rem;
            font-weight: 700;
            color: #03045E;
            letter-spacing: -0.5px;
        }

        .brand-title .highlight {
            background: linear-gradient(135deg, #03045E, #0077B6);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .tagline {
            text-align: center;
            color: #0077B6;
            font-size: 0.85rem;
            font-weight: 500;
            margin-top: -5px;
            margin-bottom: 2rem;
            letter-spacing: 0.3px;
        }

        /* Form styling */
        .input-group {
            margin-bottom: 1.5rem;
        }

        .input-group label {
            display: block;
            font-size: 0.75rem;
            font-weight: 600;
            color: #03045E;
            margin-bottom: 6px;
            letter-spacing: 0.8px;
            text-transform: uppercase;
        }

        .input-group input {
            width: 100%;
            background: #CAF0F8;
            border: 1.5px solid #90E0EF;
            border-radius: 14px;
            padding: 14px 16px;
            color: #03045E;
            font-family: 'Inter', 'Segoe UI', sans-serif;
            font-size: 0.95rem;
            font-weight: 500;
            outline: none;
            transition: all 0.25s ease;
        }

        .input-group input:focus {
            border-color: #00B4D8;
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(0, 180, 216, 0.2);
        }

        .input-group input::placeholder {
            color: #0077B6;
            font-weight: 400;
            opacity: 0.6;
        }

        /* Login button */
        .btn-auth {
            width: 100%;
            background: linear-gradient(90deg, #03045E, #0077B6);
            border: none;
            padding: 14px;
            border-radius: 40px;
            color: #CAF0F8;
            font-weight: 700;
            font-size: 1rem;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Inter', sans-serif;
            margin-top: 8px;
            box-shadow: 0 4px 10px rgba(3, 4, 94, 0.3);
        }

        .btn-auth:hover {
            background: linear-gradient(90deg, #0077B6, #00B4D8);
            transform: scale(1.01);
            box-shadow: 0 8px 20px rgba(0, 119, 182, 0.35);
        }

        .btn-auth:active {
            transform: scale(0.98);
        }

        /* Footer */
        .secure-footer {
            margin-top: 2rem;
            text-align: center;
            border-top: 1px solid #90E0EF;
            padding-top: 1.2rem;
        }

        .secure-footer p {
            font-size: 0.7rem;
            color: #0077B6;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .secure-footer i {
            color: #00B4D8;
            margin-right: 5px;
        }

        /* Loading spinner state */
        .btn-auth:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        /* Responsive */
        @media (max-width: 500px) {
            .login-container {
                padding: 1.8rem 1.5rem;
            }
            .brand-title h1 {
                font-size: 1.8rem;
            }
            .tagline {
                font-size: 0.75rem;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <!-- Top hosting badge -->
        <div class="hosting-badge">
            <span><i class="fas fa-server" style="margin-right: 6px;"></i> PREMIUM HOSTING SOLUTION</span>
        </div>

        <!-- Brand: "APON" -->
        <div class="brand-title">
            <h1><span class="highlight">APON</span> HOSTING</h1>
        </div>
        <div class="tagline">
            <i class="fas fa-cloud-upload-alt" style="font-size: 0.7rem;"></i> Secure & Reliable
        </div>

        <!-- Login Form -->
        <form id="loginForm">
            <div class="input-group">
                <label><i class="fas fa-user-circle"></i> USERNAME</label>
                <input type="text" name="username" placeholder="Enter your username" autocomplete="off" required>
            </div>
            <div class="input-group">
                <label><i class="fas fa-key"></i> PASSWORD</label>
                <input type="password" name="password" placeholder="Enter your password" required>
            </div>
            <button type="submit" class="btn-auth">
                <i class="fas fa-arrow-right-to-bracket"></i> LOGIN
            </button>
        </form>

        <!-- Security footer -->
        <div class="secure-footer">
            <p><i class="fas fa-shield-alt"></i> Secure Access Only | Encrypted Connection</p>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.querySelector('.btn-auth');
            const originalHTML = btn.innerHTML;
            
            // Show loading state
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> AUTHENTICATING...';
            btn.disabled = true;

            const formData = new FormData(e.target);
            
            try {
                const response = await fetch('/login', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                if (response.ok && data.status === 'success') {
                    window.location.href = data.url;
                } else {
                    throw new Error(data.msg || 'Invalid username or password');
                }
            } catch (error) {
                Swal.fire({
                    icon: 'error',
                    title: 'Access Denied',
                    text: error.message || 'Authentication failed. Please check your credentials.',
                    background: '#CAF0F8',
                    color: '#03045E',
                    confirmButtonColor: '#0077B6',
                    iconColor: '#d00000'
                });
                
                btn.innerHTML = originalHTML;
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
